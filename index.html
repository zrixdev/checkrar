<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@yourhandle · links</title>
  <meta name="description" content="All my links in one place — Telegram, YouTube, TikTok." />
  <meta name="theme-color" content="#e6e6e6" />
  <meta property="og:title" content="@yourhandle · links" />
  <meta property="og:description" content="All my links in one place." />
  <meta property="og:image" content="light-logo.png" />
  <link rel="icon" href="light-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --bg: #e6e6e6;
      --bg-soft: #f4f4f4;
      --card: #ffffff;
      --card-hover: #f7f7f7;
      --ink: #141414;
      --muted: #5c5c5c;
      --line: #cfcfcf;
      --shadow: #1a1a1a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    .pixel-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.28;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
    }

    .scan {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(0, 0, 0, 0.035) 3px,
        rgba(0, 0, 0, 0.035) 4px
      );
    }

    .wrap {
      position: relative;
      z-index: 2;
    }

    .pixel-title {
      font-family: "Press Start 2P", cursive;
      letter-spacing: 1px;
    }

    .pixel-soft {
      font-family: "Pixelify Sans", sans-serif;
    }

    .avatar-frame {
      width: 168px;
      height: 168px;
      position: relative;
      border: 4px solid var(--ink);
      box-shadow:
        6px 6px 0 var(--shadow),
        0 0 0 4px var(--bg),
        0 0 0 8px #ff1a3c;
      background: var(--bg);
      image-rendering: pixelated;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .spark {
      position: absolute;
      color: #22e05a;
      font-family: "Press Start 2P", cursive;
      font-size: 10px;
      animation: blink 1.4s steps(2, end) infinite;
      pointer-events: none;
    }

    .spark.cyan {
      color: #00d4ff;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      background: var(--card);
      color: var(--ink);
      border: 3px solid var(--ink);
      text-decoration: none;
      box-shadow: 4px 4px 0 var(--shadow);
      transition:
        background-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    .link-card:hover {
      background: var(--card-hover);
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0 var(--accent, #00d4ff);
    }

    .link-card:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--accent, #00d4ff);
    }

    .icon-box {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: 3px solid var(--ink);
      background: var(--bg-soft);
      color: var(--accent, var(--ink));
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid var(--line);
      background: var(--bg-soft);
      color: var(--muted);
    }

    .rise {
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="pixel-grid"></div>
  <div class="scan"></div>

  <div class="wrap min-h-dvh flex flex-col items-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-[420px]">
      <main class="flex flex-col items-center text-center">
        <div class="relative rise" style="animation-delay: 0.08s">
          <div class="avatar-frame overflow-hidden">
            <img src="light-logo.png" alt="Profile avatar" width="168" height="168" />
          </div>
          <span class="spark" style="top: 8px; right: -6px;">+</span>
          <span class="spark cyan" style="bottom: 10px; left: -8px;">+</span>
        </div>

        <h1 class="pixel-title mt-7 text-[15px] sm:text-[17px] leading-relaxed rise" style="animation-delay: 0.16s">
          YOUR NAME
        </h1>
        <p class="pixel-soft mt-2 text-xl tracking-wide rise" style="animation-delay: 0.22s; color: var(--muted)">
          @yourhandle
        </p>
        <p class="mt-3 max-w-[34ch] text-sm leading-6 rise" style="animation-delay: 0.28s; color: var(--muted)">
          pixel creator · videos · community. grab a link and say hi.
        </p>

        <div class="mt-4 flex flex-wrap items-center justify-center gap-2 rise" style="animation-delay: 0.32s">
          <span class="chip pixel-soft px-2 py-0.5 text-sm">✦ telegram</span>
          <span class="chip pixel-soft px-2 py-0.5 text-sm">▶ youtube</span>
          <span class="chip pixel-soft px-2 py-0.5 text-sm">♪ tiktok</span>
        </div>

        <nav class="mt-8 w-full flex flex-col gap-3.5" aria-label="Social links">
          <a class="link-card rise" style="--accent: #2AABEE; animation-delay: 0.38s" href="https://t.me/yourchannel" target="_blank" rel="noopener noreferrer">
            <span class="icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M9.04 15.3 8.86 19c.4 0 .57-.17.78-.38l1.87-1.8 3.88 2.85c.71.39 1.22.18 1.41-.66l2.56-12.05c.23-1.03-.37-1.43-1.05-1.18L3.7 10.1c-1 .39-.98.95-.17 1.2l4.43 1.38 10.3-6.49c.48-.3.93-.13.56.19z"/>
              </svg>
            </span>
            <span class="flex-1 text-left">
              <span class="pixel-soft block text-lg leading-none">Telegram Channel</span>
              <span class="mt-1 block text-xs" style="color: var(--muted)">news, drops & updates</span>
            </span>
            <span class="pixel-title text-[10px]" aria-hidden="true">›</span>
          </a>

          <a class="link-card rise" style="--accent: #00d4ff; animation-delay: 0.46s" href="https://t.me/yourusername" target="_blank" rel="noopener noreferrer">
            <span class="icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="8" r="3.2"/>
                <path d="M5.5 19c1.2-3.2 3.6-4.7 6.5-4.7S17.3 15.8 18.5 19"/>
              </svg>
            </span>
            <span class="flex-1 text-left">
              <span class="pixel-soft block text-lg leading-none">Personal Telegram</span>
              <span class="mt-1 block text-xs" style="color: var(--muted)">dm me directly</span>
            </span>
            <span class="pixel-title text-[10px]" aria-hidden="true">›</span>
          </a>

          <a class="link-card rise" style="--accent: #ff1a3c; animation-delay: 0.54s" href="https://youtube.com/@yourchannel" target="_blank" rel="noopener noreferrer">
            <span class="icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M23 12.2s0-3.2-.4-4.6c-.2-.9-.9-1.6-1.8-1.8C19.2 5.4 12 5.4 12 5.4s-7.2 0-8.8.4c-.9.2-1.6.9-1.8 1.8C1 9 1 12.2 1 12.2s0 3.2.4 4.6c.2.9.9 1.6 1.8 1.8 1.6.4 8.8.4 8.8.4s7.2 0 8.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.4.4-4.6.4-4.6zM9.8 15.5V8.9l6.2 3.3-6.2 3.3z"/>
              </svg>
            </span>
            <span class="flex-1 text-left">
              <span class="pixel-soft block text-lg leading-none">YouTube</span>
              <span class="mt-1 block text-xs" style="color: var(--muted)">watch the latest videos</span>
            </span>
            <span class="pixel-title text-[10px]" aria-hidden="true">›</span>
          </a>

          <a class="link-card rise" style="--accent: #22e05a; animation-delay: 0.62s" href="https://tiktok.com/@yourusername" target="_blank" rel="noopener noreferrer">
            <span class="icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M14.5 3c.3 2.4 1.6 4.1 4 4.5v2.4c-1.4 0-2.7-.4-4-1.2v6.6c0 3.4-2.7 6.1-6.2 6.1S2 18.7 2 15.3c0-3.3 2.6-6 5.9-6.1v2.5c-1.9.1-3.4 1.7-3.4 3.6 0 2 1.6 3.6 3.6 3.6s3.6-1.6 3.6-3.6V3h2.8z"/>
              </svg>
            </span>
            <span class="flex-1 text-left">
              <span class="pixel-soft block text-lg leading-none">TikTok</span>
              <span class="mt-1 block text-xs" style="color: var(--muted)">short clips & behind the scenes</span>
            </span>
            <span class="pixel-title text-[10px]" aria-hidden="true">›</span>
          </a>
        </nav>

        <footer class="mt-10 mb-4 text-center rise" style="animation-delay: 0.7s">
          <p class="pixel-title text-[8px] leading-5" style="color: var(--muted)">
            © <span id="year"></span> YOUR NAME
          </p>
        </footer>
      </main>
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
